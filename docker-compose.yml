name: raschini-mail-assistant

services:
  mail-reader:
    container_name: raschini-mail-reader
    build:
      context: ./services/mail-reader
    env_file:
      - .env
    restart: unless-stopped

    # No external ports exposed.
    # Internal worker only.

    healthcheck:
      test: ["CMD", "python", "-c", "import os; print('healthcheck ok')"]
      interval: 60s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
